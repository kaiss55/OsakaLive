<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osaka Live</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 10px 20px;
            background-color: #1f1f1f;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group label {
            font-size: 0.85rem;
            white-space: nowrap;
            color: #aaa;
            width: 50px;
        }
        .input-group input {
            flex: 1;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .input-group input:focus {
            outline: none;
            border-color: #ff0000;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
            flex: 1;
            height: calc(100vh - 100px);
        }
        .card {
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .iframe-wrapper {
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }
            .grid-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                height: auto;
            }
            .card {
                aspect-ratio: 16 / 9;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="controls">
            <div class="input-group">
                <label>清水坂:</label>
                <input type="text" id="input0" onchange="updateVideo(0, this.value)" placeholder="https://www.youtube.com/live/cUnYPpK7ENk?si=eViJx1FfIaxxXZVa">
            </div>
            <div class="input-group">
                <label>視窗 2:</label>
                <input type="text" id="input1" onchange="updateVideo(1, this.value)" placeholder="貼上 YouTube 網址或 ID">
            </div>
            <div class="input-group">
                <label>視窗 3:</label>
                <input type="text" id="input2" onchange="updateVideo(2, this.value)" placeholder="貼上 YouTube 網址或 ID">
            </div>
            <div class="input-group">
                <label>視窗 4:</label>
                <input type="text" id="input3" onchange="updateVideo(3, this.value)" placeholder="貼上 YouTube 網址或 ID">
            </div>
        </div>
    </header>

    <div class="grid-container">
        <div class="card"><div class="iframe-wrapper" id="player0"></div></div>
        <div class="card"><div class="iframe-wrapper" id="player1"></div></div>
        <div class="card"><div class="iframe-wrapper" id="player2"></div></div>
        <div class="card"><div class="iframe-wrapper" id="player3"></div></div>
    </div>

    <script>
        // 預設的 4 個 YouTube Video ID
        const DEFAULT_VIDEOS = [
            'cUnYPpK7ENk', // 清水坂
            'i2PpmC1IeKk', // 祇園 花見小路
            'MMeBDRfRHyA', // 伏見稻荷大社
            'i2PpmC1IeKk'  // 道頓堀
        ];

        let currentVideos = [...DEFAULT_VIDEOS];

        // 從 URL 網址解析 YouTube ID (支援完整網址、share 連結或純 ID)
        function extractVideoId(url) {
            if (!url) return '';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|live\/)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url.trim();
        }

        // 初始化：讀取 URL Query Parameters，若無則使用預設值
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const vParam = urlParams.get('v');

            if (vParam) {
                const paramIds = vParam.split(',');
                for (let i = 0; i < 4; i++) {
                    if (paramIds[i]) currentVideos[i] = paramIds[i];
                }
            }

            // 渲染 4 個播放器與 Input 預填值
            for (let i = 0; i < 4; i++) {
                document.getElementById(`input${i}`).value = `https://www.youtube.com/watch?v=${currentVideos[i]}`;
                renderPlayer(i, currentVideos[i]);
            }
        }

        // 渲染 iframe
        function renderPlayer(index, videoId) {
            const container = document.getElementById(`player${index}`);
            if (!videoId) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1" 
                        allow="autoplay; encrypted-media" allowfullscreen></iframe>
            `;
        }

        // 使用者修改 Input 時觸發
        function updateVideo(index, value) {
            const videoId = extractVideoId(value);
            currentVideos[index] = videoId;
            renderPlayer(index, videoId);
            updateURL();
        }

        // 更新網址列的 Query Parameter (?v=ID1,ID2,ID3,ID4)
        function updateURL() {
            const newParams = new URLSearchParams();
            newParams.set('v', currentVideos.join(','));
            const newRelativePathQuery = window.location.pathname + '?' + newParams.toString();
            window.history.replaceState(null, '', newRelativePathQuery);
        }

        // 啟動
        init();
    </script>
</body>
</html>
