<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本即時直播 2x2 監視器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 10px 20px;
            background-color: #1f1f1f;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
            flex: 1;
            height: calc(100vh - 50px);
        }
        .card {
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .card-title {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            font-size: 0.9rem;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            border-bottom-right-radius: 8px;
            pointer-events: none;
        }
        .iframe-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 響應式：手機直立時自動變成 1 欄 */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                height: auto;
            }
            .card {
                aspect-ratio: 16 / 9;
            }
        }
    </style>
</head>
<body>

    <header>日本景點即時直播 (2x2 Auto-Mute)</header>

    <div class="grid-container">
        <div class="card">
            <div class="card-title">清水坂</div>
            <div class="iframe-wrapper">
                <iframe src="https://www.youtube.com/embed/cUnYPpK7ENk?autoplay=1&mute=1" 
                        allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>

        <div class="card">
            <div class="card-title">祇園 花見小路</div>
            <div class="iframe-wrapper">
                <iframe src="https://www.youtube.com/embed/i2PpmC1IeKk?autoplay=1&mute=1" 
                        allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>

        <div class="card">
            <div class="card-title">伏見稻荷大社 表參道</div>
            <div class="iframe-wrapper">
                <iframe src="https://www.youtube.com/embed/MMeBDRfRHyA?autoplay=1&mute=1" 
                        allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>

        <div class="card">
            <div class="card-title">道頓堀</div>
            <div class="iframe-wrapper">
                <iframe src="https://www.youtube.com/embed/i2PpmC1IeKk?autoplay=1&mute=1" 
                        allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

</body>
</html>
